<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Alison Alves de Aquino - Analista de Sistemas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B0F"/>
      <stop offset="55%" stop-color="#120D1C"/>
      <stop offset="100%" stop-color="#0B0B0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="86%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#A855F7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#glow)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="1200" height="280" fill="url(#glow2)">
    <animate attributeName="opacity" values="1;0.6;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- barra lateral de acento -->
  <rect x="64" y="72" width="3" height="136" fill="#A855F7" rx="1.5">
    <animate attributeName="height" values="136;108;136" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="72;86;72" dur="4s" repeatCount="indefinite"/>
  </rect>

  <g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
    <text x="92" y="98" fill="#6E6E80" font-size="15" letter-spacing="3">analista@sistemas:~$</text>

    <text x="92" y="150" fill="#FFFFFF" font-size="40" font-weight="700" letter-spacing="1.5">
      ALISON ALVES DE AQUINO
    </text>

    <rect x="884" y="124" width="13" height="30" fill="#A855F7">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <rect x="92" y="172" width="420" height="2" fill="url(#rule)"/>

    <text x="92" y="206" fill="#C9C9D4" font-size="17" letter-spacing="0.5">
      SAP Business One · HANA · Engenharia de Dados · Automação
    </text>
  </g>

  <!-- chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <g transform="translate(92,232)">
      <rect width="104" height="28" rx="14" fill="#A855F7" fill-opacity="0.10" stroke="#A855F7" stroke-opacity="0.45"/>
      <text x="52" y="19" fill="#C4B5FD" text-anchor="middle">SAP B1</text>
    </g>
    <g transform="translate(208,232)">
      <rect width="104" height="28" rx="14" fill="#A855F7" fill-opacity="0.10" stroke="#A855F7" stroke-opacity="0.45"/>
      <text x="52" y="19" fill="#C4B5FD" text-anchor="middle">Power BI</text>
    </g>
    <g transform="translate(324,232)">
      <rect width="104" height="28" rx="14" fill="#A855F7" fill-opacity="0.10" stroke="#A855F7" stroke-opacity="0.45"/>
      <text x="52" y="19" fill="#C4B5FD" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(440,232)">
      <rect width="104" height="28" rx="14" fill="#A855F7" fill-opacity="0.10" stroke="#A855F7" stroke-opacity="0.45"/>
      <text x="52" y="19" fill="#C4B5FD" text-anchor="middle">Docker</text>
    </g>
  </g>

  <!-- gráfico decorativo à direita -->
  <g stroke="#A855F7" fill="none" stroke-width="2" opacity="0.65">
    <path d="M760 200 L820 170 L880 182 L940 128 L1000 146 L1060 92 L1120 108">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#C4B5FD">
    <circle cx="820" cy="170" r="3"/>
    <circle cx="940" cy="128" r="3"/>
    <circle cx="1060" cy="92" r="3"/>
  </g>
</svg>
